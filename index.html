<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo Discord Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💬 Discord Messages</h1>
        <div id="messages" class="messages-container"></div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
            <button id="sendButton">Send</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onChildAdded, query, limitToLast } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Load Firebase config from firebase.js
        const firebaseConfig = await fetch('firebase.js').then(r => r.text()).then(text => {
            const match = text.match(/const firebaseConfig = ({[\s\S]*?});/);
            if (match) {
                return eval('(' + match[1] + ')');
            }
            throw new Error('Could not parse firebase.js');
        });

        // Load Discord webhook URL
        const webhookUrl = await fetch('webhook.js').then(r => r.text()).then(text => {
            const match = text.match(/const DISCORD_WEBHOOK_URL = "(.*?)"/);
            if (match) {
                return match[1];
            }
            throw new Error('Could not parse webhook.js');
        });

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        // Listen to new messages
        const messagesRef = ref(db, 'messages');
        const recentMessagesQuery = query(messagesRef, limitToLast(50));

        onChildAdded(recentMessagesQuery, (snapshot) => {
            const messageData = snapshot.val();
            addMessage(messageData);
        });

        function addMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            
            const time = new Date(message.timestamp).toLocaleTimeString('vi-VN');
            const sourceClass = message.source === 'discord' ? 'discord' : 'web';
            
            messageDiv.innerHTML = `
                <div class="message-header">
                    <span class="author ${sourceClass}">${message.author}</span>
                    <span class="time">${time}</span>
                </div>
                <div class="message-content">${message.content}</div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function sendMessage() {
            const content = messageInput.value.trim();
            if (content) {
                try {
                    // Send to Firebase
                    await push(messagesRef, {
                        content: content,
                        author: 'Bảo (Web)',
                        timestamp: Date.now(),
                        source: 'web'
                    });

                    // Send to Discord webhook (TEMPORARY - until Functions deploy)
                    await fetch(webhookUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            content: content
                        })
                    });

                    messageInput.value = '';
                } catch (error) {
                    console.error('Error sending message:', error);
                }
            }
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
